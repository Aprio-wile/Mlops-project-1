name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - "app/streamlit_app.py"
      - "app/api.py"
      - "src/**"
      - "artifacts/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ml-app
  IMAGE_TAG: latest
  CONTAINER_NAME: ml-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Run tests
      - name: Run tests
        run: |
            pytest -v 

      # (Optional) Validate DVC pipeline
      - name: Check DVC pipeline
        run: |
          pip install dvc
          dvc repro --dry

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      # Tag image
      - name: Tag Docker Image
        run: |
          docker tag \
          ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # Push image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          


      - name: Get Live EC2 Public IP
        id: ec2-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          echo "instance_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      # Deploy to EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ steps.ec2-ip.outputs.instance_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ steps.login-ecr.outputs.registry }}

            # 1. Stop and remove existing containers first to unlock the image
            docker stop ml-api ${{ env.CONTAINER_NAME }} || true
            docker rm ml-api ${{ env.CONTAINER_NAME }} || true

            # 2. Directly delete the old image to instantly clear RAM/Disk space
            docker rmi ${{ steps.login-ecr.outputs.registry }}/ml-app:latest || true
            docker image prune -af

            # 3. Now safely pull the fresh image without stacking memory
            docker pull ${{ steps.login-ecr.outputs.registry }}/ml-app:latest

            # 4. Deploy FastAPI
            docker run -d \
              --name ml-api \
              --restart always \
              -p 8500:8500 \
              ${{ steps.login-ecr.outputs.registry }}/ml-app:latest \
              uvicorn app.api:app --host 0.0.0.0 --port 8500

            # 5. Deploy Streamlit with Mobile Network Overrides
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -p 8501:8501 \
              -e API_URL="${{ secrets.API_URL }}" \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
              streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false